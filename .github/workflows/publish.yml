name: Publish web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # one Pages deploy at a time, but the slow iPhone check below doesn't hold the next one up
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # only what the game needs; tools/ and the README stay out of the site
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icons workspace assets _site/
          if [ -d worlds ]; then cp -r worlds _site/; fi
          # app/latest.json: the newest phone-app build (written by the app repo's CI) — the apps check it
          if [ -d app ]; then cp -r app _site/; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # what it looks like in Safari on an iPhone (screenshots in the run's artifacts)
  iphone-safari:
    needs: deploy
    # not for the app repo's "App build dev-N is out" commits (only app/latest.json changed)
    if: ${{ !startsWith(github.event.head_commit.message, 'App build') }}
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open the live site in iPhone Safari
        run: bash tools/safari_check.sh "${{ needs.deploy.outputs.url }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-safari
          path: safari/
          if-no-files-found: ignore
